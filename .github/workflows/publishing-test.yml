name: Publishing tools self-tests
on:
  pull_request:
    paths:
      - "tools/publishing/**"
      - ".github/workflows/publishing-test.yml"
  push:
    branches: [main]
    paths:
      - "tools/publishing/**"
      - ".github/workflows/publishing-test.yml"
permissions:
  contents: read
jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile tools/publishing/*.py
      - run: python tools/publishing/schedule.py --self-test
      - run: python tools/publishing/akalmesin_sync.py --self-test
      - run: python tools/publishing/check.py --self-test
